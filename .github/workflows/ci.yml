name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config python3
      - name: Configure
        run: meson setup build
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs
      - name: Build docs
        run: python3 scripts/build_docs.py

  sanitize:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config python3 clang
          clang_major=$(clang -dumpversion | cut -d. -f1)
          sudo apt-get install -y "libclang-rt-${clang_major}-dev"
      - name: Configure
        run: >-
          meson setup build-san
          -Db_sanitize=address,undefined -Db_lundef=false
          -Dwerror=true
      - name: Build
        run: meson compile -C build-san
      - name: Test
        run: meson test -C build-san --print-errorlogs

  orca-optional:
    if: ${{ vars.ORCAC_ORCA != '' }}
    runs-on: ubuntu-24.04
    env:
      ORCAC_ORCA: ${{ vars.ORCAC_ORCA }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config python3
      - name: Configure
        run: meson setup build-real
      - name: Build
        run: meson compile -C build-real
      - name: ORCA real optional lane
        run: meson test -C build-real --print-errorlogs --suite optional-orca
