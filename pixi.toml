[workspace]
authors = ["Rohit Goswami <rgoswami@ieee.org>"]
channels = ["conda-forge"]
description = "C ABI for running ORCA as an rgpot engine (child process, EnGrad)."
name = "orcac"
platforms = ["linux-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[dependencies]
compilers = ">=1.8.0,<2"
meson = ">=1.5.2,<2"
ninja = ">=1.11,<2"
pkgconf = ">=2.5.1,<3"
python = ">=3.10,<4"
capnproto = ">=1.0,<2"

[tasks]
test = { cmd = "meson setup build -Dwith_tests=true && meson compile -C build && meson test -C build --print-errorlogs", description = "Configure, build, and test (live ORCA test skips without orca)" }
test-sanitize = { cmd = "meson setup build-sanitize -Dwith_tests=true -Db_sanitize=address,undefined -Db_lundef=false && meson compile -C build-sanitize && ASAN_OPTIONS=detect_leaks=0 meson test -C build-sanitize --print-errorlogs", description = "Suite under ASan/UBSan" }
test-live = { cmd = "meson setup build -Dwith_tests=true && meson compile -C build && meson test -C build --suite live --print-errorlogs -v", description = "The real ORCA single point; set RGPOT_ORCA or put orca on PATH" }
