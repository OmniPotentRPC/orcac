[tool.towncrier]
name = "orcac"
filename = "CHANGELOG.md"
directory = "docs/newsfragments"
title_format = "## {version} - {project_date}"
underlines = ["", "", ""]
start_string = "# Changelog\n\n"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true
